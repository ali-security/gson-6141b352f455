name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: Report skipped tests
        if: always()
        run: |
          echo "Skipped tests recorded in surefire reports:"
          for f in $(find . -path '*/target/surefire-reports/TEST-*.xml'); do
            grep -B1 '<skipped' "$f" | grep -o '<testcase name="[^"]*" classname="[^"]*"' | sed "s#^#  $f: #"
            grep -o '<skipped[^>]*>' "$f" | sed "s#^#    #"
          done
          echo "JsonReaderPathTest.multipleTopLevelValuesInOneDocument[OBJECT_READER] (JsonTreeReader) is skipped by its own"
          echo "assumeTrue(factory == Factory.STRING_READER): multiple top-level values in one document only"
          echo "exist for the streaming STRING_READER; the same test runs and passes for STRING_READER."
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: gson/target/gson-2.9.0.jar
          if-no-files-found: error
